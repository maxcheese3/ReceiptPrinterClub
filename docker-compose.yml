services:

  # ── PrintBridge API + Web UI ────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: printbridge-server
    restart: unless-stopped
    # No longer exposed directly — Caddy proxies to it internally
    expose:
      - "3000"
      - "2525"
    volumes:
      - printbridge-data:/app/data
      - ./server/public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SMTP_PORT=2525
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - RATE_LIMIT_WINDOW_MS=60000
      # Trust Caddy's forwarded IP headers so rate limiting sees real client IPs
      - TRUST_PROXY=1
    networks:
      - internal

  # ── Caddy — HTTPS reverse proxy with automatic Let's Encrypt certs ──────────
  # Used when hosting with a real domain + open ports 80/443.
  # Set DOMAIN in .env (e.g. DOMAIN=print.yourdomain.com).
  # Comment out this service if using Cloudflare Tunnel instead.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: printbridge-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "0.0.0.0:80:80"
  #     - "0.0.0.0:443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   environment:
  #     - DOMAIN=${DOMAIN:-localhost}
  #   networks:
  #     - internal
  #   depends_on:
  #     - server

  # ── Cloudflare Tunnel — zero-config public HTTPS, no port forwarding needed ─
  # Alternative to Caddy if you don't have a static IP or open ports.
  # 1. Create a tunnel at https://one.dash.cloudflare.com → Zero Trust → Networks → Tunnels
  # 2. Copy the tunnel token and set CLOUDFLARE_TUNNEL_TOKEN in .env
  # 3. Uncomment this service and comment out caddy above.
  #
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: printbridge-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - server

networks:
  internal:
    driver: bridge

volumes:
  printbridge-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
