services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: printbridge-server
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:2525:2525"
    volumes:
      - printbridge-data:/app/data
      - ./server/public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SMTP_PORT=2525
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=10
      # Optional: set a base URL for display in emails/docs
      - BASE_URL=http://localhost:3000

volumes:
  printbridge-data:
    driver: local
