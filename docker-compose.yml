services:

  # ── PrintBridge API + Web UI ────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: printbridge-server
    restart: unless-stopped
    expose:
      - "3000"
      - "2525"
    volumes:
      - printbridge-data:/app/data
      - ./server/public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SMTP_PORT=2525
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - RATE_LIMIT_WINDOW_MS=60000
      - TRUST_PROXY=1
    networks:
      - internal

  # ── Caddy — HTTPS reverse proxy (Option B: domain + port forwarding) ────────
  # Set DOMAIN=print.yourdomain.com in .env, forward ports 80/443 on router.
  # Comment this out if using Cloudflare Tunnel instead.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: printbridge-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "0.0.0.0:80:80"
  #     - "0.0.0.0:443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   environment:
  #     - DOMAIN=${DOMAIN:-localhost}
  #   networks:
  #     - internal
  #   depends_on:
  #     - server

  # ── Cloudflare Tunnel (Option A: no port forwarding needed) ─────────────────
  # 1. Create tunnel at https://one.dash.cloudflare.com → Zero Trust → Networks → Tunnels
  # 2. Set public hostname: service = http://server:3000
  # 3. Paste tunnel token into .env as CLOUDFLARE_TUNNEL_TOKEN=...
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: printbridge-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - server

networks:
  internal:
    driver: bridge

volumes:
  printbridge-data:
    driver: local
