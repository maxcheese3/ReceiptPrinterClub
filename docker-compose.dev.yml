services:

  # ── PrintBridge API server ─────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: printbridge-server-dev
    expose:
      - "3000"
      - "2525"
    volumes:
      - printbridge-data-dev:/app/data
      - ./server/public:/app/public
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SMTP_PORT=2525
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-devpassword}
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET:-devsecret}
      - TRUST_PROXY=0
    networks:
      - dev-internal

  # ── Vite dev server (hot-reload at localhost:8008) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: printbridge-frontend-dev
    ports:
      - "8008:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      # Override with VITE_API_TARGET=https://your-prod-url in .env or on the CLI
      # to proxy API calls to a remote server instead of the local server container.
      - VITE_API_TARGET=${VITE_API_TARGET:-http://server:3000}
    networks:
      - dev-internal
    depends_on:
      - server

networks:
  dev-internal:
    driver: bridge

volumes:
  printbridge-data-dev:
    driver: local
  frontend-node-modules:
    driver: local
